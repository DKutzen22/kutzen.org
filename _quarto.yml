project:
  type: website

website:
  title: "Dalton Kutzen"
  site-url: https://www.kutzen.org
  description: "More about me than anyone wants to know"
  open-graph: true
  navbar:
    logo: images/logo.svg
    background: primary
    search: true
    right:
      - href: index.qmd
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: blog/index.qmd
        text: Blog
      - href: about.qmd
        text: About
      - icon: rss
        href: blog.xml
    tools:
      - icon: github
        text: Source Code
        href: https://github.com/DKutzen22/kutzen.org



format:
  html:
    theme:
      - darkly
      - brand
    syntax-highlighting: espresso
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    code-block-border-left: false
    code-fold: false
    css: styles.css
    toc: true



