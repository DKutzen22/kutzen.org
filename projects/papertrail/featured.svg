<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bc8c" />
      <stop offset="100%" stop-color="#7ee2c0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Illustration Card -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Document Stack Base -->
    <rect x="25" y="15" width="220" height="270" rx="8" fill="#1b2430" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="8" width="220" height="270" rx="8" fill="#243042" stroke="#375a7f" stroke-width="1.5" />
    
    <!-- Top Document: Typst / Résumé -->
    <rect x="0" y="0" width="220" height="270" rx="8" fill="#ffffff" />
    
    <!-- Header of the document -->
    <rect x="20" y="24" width="90" height="10" rx="2" fill="#0f172a" />
    <rect x="20" y="40" width="130" height="5" rx="1.5" fill="#64748b" />
    
    <!-- Rule divider -->
    <line x1="20" y1="56" x2="200" y2="56" stroke="#00bc8c" stroke-width="2" />
    
    <!-- Section 1 -->
    <rect x="20" y="70" width="60" height="6" rx="1.5" fill="#0f172a" />
    <rect x="20" y="83" width="160" height="4" rx="1" fill="#94a3b8" />
    <rect x="20" y="93" width="140" height="4" rx="1" fill="#cbd5e1" />
    
    <!-- Section 2 -->
    <rect x="20" y="112" width="75" height="6" rx="1.5" fill="#0f172a" />
    <rect x="20" y="125" width="170" height="4" rx="1" fill="#94a3b8" />
    <rect x="20" y="135" width="150" height="4" rx="1" fill="#cbd5e1" />
    <rect x="20" y="145" width="165" height="4" rx="1" fill="#cbd5e1" />
    
    <!-- Section 3 -->
    <rect x="20" y="164" width="50" height="6" rx="1.5" fill="#0f172a" />
    <rect x="20" y="177" width="155" height="4" rx="1" fill="#94a3b8" />
    <rect x="20" y="187" width="130" height="4" rx="1" fill="#cbd5e1" />

    <!-- Badges on Document -->
    <rect x="20" y="210" width="50" height="14" rx="4" fill="#e0f2fe" />
    <rect x="26" y="214" width="38" height="6" rx="1.5" fill="#0369a1" />
    
    <rect x="76" y="210" width="45" height="14" rx="4" fill="#ecfdf5" />
    <rect x="82" y="214" width="33" height="6" rx="1.5" fill="#059669" />
  </g>

  <!-- Typography / Info Side -->
  <g transform="translate(380, 130)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="155" height="28" rx="14" fill="#132e2b" stroke="#00bc8c" stroke-width="1" />
    <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7ee2c0" letter-spacing="1.5">RÉSUMÉ AS CODE</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Papertrail</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">Structured YAML ➔ Typst ➔ Polished PDFs</text>
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b" font-weight="400">Single-source version control for CV &amp; Résumé</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" font-family="monospace" font-size="12" fill="#cbd5e1">Quarto</text>

      <rect x="80" y="0" width="65" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="95" y="17" font-family="monospace" font-size="12" fill="#7ee2c0">Typst</text>

      <rect x="155" y="0" width="60" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="170" y="17" font-family="monospace" font-size="12" fill="#cbd5e1">YAML</text>
    </g>
  </g>
</svg>
